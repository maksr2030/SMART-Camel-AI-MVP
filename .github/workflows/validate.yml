name: Validate SMART Camel AI MVP

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public MVP and due-diligence structure
        run: python scripts/validate.py
      - name: Run executable core evidence tests
        run: node tests/test_core.mjs
      - name: Run Phase 3 Grade A evidence tests
        run: node tests/test_phase3.mjs
      - name: Run Phase 4 245-capability reconciliation tests
        run: node tests/test_phase4.mjs
      - name: Run evidence contract tests
        run: python tests/test_evidence_contract.py
      - name: Scan public release for secrets and sensitive files
        run: python scripts/security_check.py
      - name: Validate acquisition release readiness contract
        run: python scripts/release_check.py
